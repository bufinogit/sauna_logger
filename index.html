<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Obsazenost sauny</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: 40px auto; }
  </style>
</head>
<body>

<h2>Obsazenost sauny</h2>
<canvas id="chart"></canvas>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTSROGuvLLP0EUzAKIGZm5cgk_amvP5YmS5AR4azjF9aRVfA4fJ4ghZCGGhIZI76HiJV69sb0Cb32Yb/pub?gid=0&single=true&output=csv";

async function loadCSV() {
  const res = await fetch(CSV_URL);
  const text = await res.text();

  const rows = text.trim().split("\n").slice(1);
  const labels = [];
  const values = [];

  for (const row of rows) {
    const cols = row.split(",");
    labels.push(cols[0]);      // time_HH_MM
    values.push(Number(cols[1])); // occupancy
  }

  new Chart(document.getElementById("chart"), {
  type: "line",
  data: {
    labels,
    datasets: [{
      label: "Obsazenost",
      data: values,
      tension: 0.3
    }]
  },
    options: {
      scales: {
        x: {
          type: "time",
          time: {
            unit: "minute",
            displayFormats: {
              minute: "HH:mm"
            }
          },
        min: "2026-01-11T09:00:00+01:00",
        max: "2026-01-11T21:00:00+01:00"
      },
        y: { min: 0, max: 30 }
      }
    }
  });
}

loadCSV();
</script>

</body>
</html>
