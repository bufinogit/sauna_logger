<!DOCTYPE html>
<html lang="cs">

<head>
  <meta charset="UTF-8">
  <title>Sauna bazen slovany</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-matrix@1.3.0"></script>
  <style>
    body {
      font-family: sans-serif;
      max-width: 900px;
      margin: 40px auto;
    }
  </style>
</head>

<body>

  <h1>Průměrná narvanost sauny bazen slovany</h1>
  <!--
  <div id="legend" style="display:flex; gap:10px;">
    <div style="background:#d9fdd3;width:30px;height:20px;"></div> 0-5
    <div style="background:#9bdcff;width:30px;height:20px;"></div> 6-15
    <div style="background:#ffd966;width:30px;height:20px;"></div> 16-25
    <div style="background:#ff7f7f;width:30px;height:20px;"></div> 26-30
  </div>
-->
  <canvas id="heatmap"></canvas>
  <h3>Pondělí (Muži)</h3><canvas id="mon"></canvas>
  <h3>Úterý (Ženy -> 14:00)</h3><canvas id="tue"></canvas>
  <h3>Středa</h3><canvas id="wed"></canvas>
  <h3>Čtvrtek (Ženy)</h3><canvas id="thu"></canvas>
  <h3>Pátek</h3><canvas id="fri"></canvas>
  <h3>Sobota</h3><canvas id="sat"></canvas>
  <h3>Neděle</h3><canvas id="sun"></canvas>

  <script>
    const TSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTSROGuvLLP0EUzAKIGZm5cgk_amvP5YmS5AR4azjF9aRVfA4fJ4ghZCGGhIZI76HiJV69sb0Cb32Yb/pub?gid=0&single=true&output=tsv";
    const TSV_AVG_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTSROGuvLLP0EUzAKIGZm5cgk_amvP5YmS5AR4azjF9aRVfA4fJ4ghZCGGhIZI76HiJV69sb0Cb32Yb/pub?gid=2098029931&single=true&output=tsv";

    async function loadCSV() {
      const res = await fetch(TSV_URL);
      const text = await res.text();

      const rows = text.trim().split("\n").slice(1);
      const labels = [];
      const values = [];

      for (const row of rows) {
        const cols = row.split("\t");
        labels.push(cols[0]);      // time_ISO
        values.push(Number(cols[1])); // occupancy
      }

      const dayMap = {
        1: "mon", 2: "tue", 3: "wed",
        4: "thu", 5: "fri", 6: "sat", 0: "sun"
      };

      const buckets = {
        mon: {}, tue: {}, wed: {}, thu: {}, fri: {}, sat: {}, sun: {}
      };
      const buckets = {
        mon: {}, tue: {}, wed: {}, thu: {}, fri: {}, sat: {}, sun: {}
      };

      for (const row of rows) {
        const cols = row.split("\t");
        const d = new Date(cols[0]);
        const day = dayMap[d.getDay()];
        const dateKey = d.toISOString().slice(0, 10);

        buckets[day][dateKey] ??= [];
        buckets[day][dateKey].push({
          x: cols[0],
          y: Number(cols[1])
        });
      }
        buckets[day][dateKey] ??= [];
        buckets[day][dateKey].push({
          x: cols[0],
          y: Number(cols[1])
        });
      }


      function draw(dayKey) {
        const dates = Object.keys(buckets[dayKey]).sort();
        if (!dates.length) return;

        const datasets = dates.map((date, i) => {
          const data = buckets[dayKey][date].map(d => {
            const dt = new Date(d.x);
            const hour = dt.getHours() + dt.getMinutes() / 60;
            return { x: hour, y: d.y };
          });

          if (i === dates.length - 1) {
            return {
              label: date,
              data,
              tension: 0.4,
              borderColor: "#007bff",
              backgroundColor: "#007bff",
              pointRadius: 0,
              borderWidth: 4
            };
          } else {
            return {
              label: "",
              data,
              tension: 0.4,
              borderColor: "#90c4fc",
              backgroundColor: "#90c4fc",
              pointRadius: 0,
              borderWidth: 1
            };
          }
        });

        new Chart(document.getElementById(dayKey), {
          type: "line",
          data: { datasets },
          options: {
            plugins: {
              legend: {
                display: false
              }
            },
            scales: {
              x: {
                type: "linear",
                min: 8.5,   // 08:30
                max: 21.5,  // 21:30
                ticks: {
                  stepSize: 1,
                  callback: v => {
                    const h = Math.floor(v);
                    const m = Math.round((v - h) * 60);
                    return `${h}:${m.toString().padStart(2, "0")}`;
                  }
                }
              },
              y: { min: 0, max: 30 }
            }
          }
        });
      }
      ["mon", "tue", "wed", "thu", "fri", "sat", "sun"].forEach(draw);


      // ===== HEATMAPA =====

      // Načtení průměrů
      const res_avg = await fetch(TSV_AVG_URL);
      const text_avg = await res_avg.text();
      const rows_avg = text_avg.trim().split("\n").slice(1);

      const days = ["Po", "Út", "St", "Čt", "Pá", "So", "Ne"];
      const hours = Array.from({ length: 14 }, (_, i) => i + 8); // 8-21

      // Převod dat z TSV průměrů na formát pro Chart.js
      const datasets = days.map((day, dayIdx) => {
        const data = hours.map(h => {
          // Najdi odpovídající řádek v rows_avg
          const row = rows_avg.find(r => {
            const [d, hourStr] = r.split("\t");
            return d.trim() === day && Number(hourStr) === h;
          });
          return row ? Number(row.split("\t")[2]) : 0; // pokud chybí, nula
        });

        // Náhodná barva nebo zvolená paleta
        const colors = ["#6082b6", "#f4ca16", "#dbd7d2", "#eb1f48", "#00a86b", "#8c564b", "#e377c2"];
        return {
          label: day,
          data,
          backgroundColor: colors[dayIdx],
        };
      });

      // Vykreslení clustered bar chart
      new Chart(document.getElementById("heatmap"), {
        type: "bar",
        data: {
          labels: hours,
          datasets
        },
        options: {
          plugins: {
            legend: { display: true }
          },
          responsive: true,
          scales: {
            x: {
              stacked: false,
              title: { display: true, text: "Hodina" }
            },
            y: {
              stacked: false,
              title: { display: true, text: "Průměrný počet lidí" },
              beginAtZero: true
            }
          }
        }
      });

    }
    loadCSV();
  </script>

</body>

</html>
