<!DOCTYPE html>
<html lang="cs">

<head>
  <meta charset="UTF-8">
  <title>Kdy nechodit do sauny..</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-matrix@1.3.0"></script>
  <style>
    body {
      font-family: sans-serif;
      max-width: 900px;
      margin: 40px auto;
    }
  </style>
</head>

<body>

  <h1 style="text-align:center;">Průměrná namačkanost v sauně</h1>
  <h6 style="text-align:center;">*historické údaje nejsou spolehlivým ukazatelem ani zárukou spokojenosti a autor nenese žádnou odpovědnost za vaše současné ani budoucí problémy</h6>
  <div style="
  width:300px;
  height:15px;
  margin-top:10px;
  margin:0 auto; 
  border-radius:6px;
  background: linear-gradient(
    to right,
    hsl(120, 85%, 55%),  /* 0 lidí */
    hsl(60, 85%, 55%),   /* ~15 lidí */
    hsl(0, 85%, 55%)     /* 30 lidí */
  );
"></div>

  <div style="
  display:flex;
  justify-content:space-between;
  width:300px;
  font-size:12px;
  font-family:sans-serif;
  margin:0 auto;
">
    <span>0</span>
    <span>15</span>
    <span>30</span>
  </div>

  <canvas id="heatmap"></canvas>
  <h3 style="text-align:center;">Pondělí (Muži)</h3><canvas id="mon"></canvas>
  <h3 style="text-align:center;">Úterý (Ženy -> 14:00)</h3><canvas id="tue"></canvas>
  <h3 style="text-align:center;">Středa</h3><canvas id="wed"></canvas>
  <h3 style="text-align:center;">Čtvrtek (Ženy)</h3><canvas id="thu"></canvas>
  <h3 style="text-align:center;">Pátek</h3><canvas id="fri"></canvas>
  <h3 style="text-align:center;">Sobota</h3><canvas id="sat"></canvas>
  <h3 style="text-align:center;">Neděle</h3><canvas id="sun"></canvas>

  <script>
    const TSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTSROGuvLLP0EUzAKIGZm5cgk_amvP5YmS5AR4azjF9aRVfA4fJ4ghZCGGhIZI76HiJV69sb0Cb32Yb/pub?gid=0&single=true&output=tsv";
    const TSV_AVG_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTSROGuvLLP0EUzAKIGZm5cgk_amvP5YmS5AR4azjF9aRVfA4fJ4ghZCGGhIZI76HiJV69sb0Cb32Yb/pub?gid=2098029931&single=true&output=tsv";

    async function loadCSV() {

      // ===== HEATMAPA =====

      // Načtení průměrů
      const res_avg = await fetch(TSV_AVG_URL);
      const text_avg = await res_avg.text();
      const rows_avg = text_avg.trim().split("\n").slice(1);

      const days = ["Po", "Út", "St", "Čt", "Pá", "So", "Ne"];
      const hours = Array.from({ length: 12 }, (_, i) => i + 9); // 9–21

      // funkce na barvu podle hodnoty
      function getColor(v) {
        const t = v / 30;          // 0–1
        const hue = 120 - (120 * t); // 120 → 0
        return `hsl(${hue}, 85%, 55%)`;
      }

      // vytvoření datasetů – každý dataset = 1 hodina
      const datasets = hours.map(h => {
        const data = days.map(day => {
          const row = rows_avg.find(r => {
            const [d, hourStr] = r.split("\t");
            return d.trim() === day && Number(hourStr) === h;
          });
          return row ? 1 : 1; // každý segment má stejnou šířku
        });

        const colors = days.map(day => {
          const row = rows_avg.find(r => {
            const [d, hourStr] = r.split("\t");
            return d.trim() === day && Number(hourStr) === h;
          });
          const v = row ? Number(row.split("\t")[2]) : 0;
          return getColor(v);
        });

        return {
          label: `${h}:00`,
          data,
          backgroundColor: colors,
          borderWidth: 0,
          stack: "heat"
        };
      });

      new Chart(document.getElementById("heatmap"), {
        type: "bar",
        data: {
          labels: days,
          datasets
        },
        options: {
          indexAxis: "y", // otočí graf → řádky
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: ctx => {
                  const day = ctx.label;
                  const hour = ctx.dataset.label;
                  const row = rows_avg.find(r => {
                    const [d, h] = r.split("\t");
                    return d.trim() === day && h === hour.replace(":00", "");
                  });
                  const v = row ? row.split("\t")[2] : "?";
                  return `${day} ${hour} → ${v} lidí`;
                }
              }
            }
          },
          scales: {
            x: {
              stacked: true,
              min: 0,
              max: hours.length,
              ticks: {
                stepSize: 1,
                callback: (value) => {
                  const h = hours[value];
                  return h !== undefined ? `${h}:00` : "";
                }
              },
              grid: { display: false }
            },
            y: {
              stacked: true,
            }
          }
        }
      });

      // ===== DAY GRAPHS =====

      const res = await fetch(TSV_URL);
      const text = await res.text();

      const rows = text.trim().split("\n").slice(1);
      const labels = [];
      const values = [];

      for (const row of rows) {
        const cols = row.split("\t");
        labels.push(cols[0]);      // time_ISO
        values.push(Number(cols[1])); // occupancy
      }

      const avgLines = {
        mon: [], tue: [], wed: [], thu: [], fri: [], sat: [], sun: []
      };

      for (const row of rows_avg) {
        const cols = row.split("\t");

        const dayCZ = cols[0]?.trim();  // Po, Út...
        const hour = Number(cols[1]);
        const avg = Number(cols[2]);

        const map = { "Po": "mon", "Út": "tue", "St": "wed", "Čt": "thu", "Pá": "fri", "So": "sat", "Ne": "sun" };
        const dayKey = map[dayCZ];

        if (!dayKey || isNaN(hour) || isNaN(avg)) continue;

        avgLines[dayKey].push({
          x: hour,   // střed bloku (stejně jako osa)
          y: avg
        });
      }

      const dayMap = {
        1: "mon", 2: "tue", 3: "wed",
        4: "thu", 5: "fri", 6: "sat", 0: "sun"
      };

      const buckets = {
        mon: {}, tue: {}, wed: {}, thu: {}, fri: {}, sat: {}, sun: {}
      };

      for (const row of rows) {
        const cols = row.split("\t");
        const d = new Date(cols[0]);
        const day = dayMap[d.getDay()];
        const dateKey = d.toISOString().slice(0, 10);

        buckets[day][dateKey] ??= [];
        buckets[day][dateKey].push({
          x: cols[0],
          y: Number(cols[1])
        });
      }


      function draw(dayKey) {
        const dates = Object.keys(buckets[dayKey]).sort();
        if (!dates.length) return;

        const datasets = dates.map((date, i) => {
          const data = buckets[dayKey][date].map(d => {
            const dt = new Date(d.x);
            const hour = dt.getHours() + dt.getMinutes() / 60;
            return { x: hour, y: d.y };
          });

          return {
            label: "Naměřené hodnoty",
            data,
            tension: 0.4,
            borderColor: "#eb637e",
            backgroundColor: "#f2d8dd",
            pointRadius: 0,
            borderWidth: 2,
            order: 1,
            isHistory: true
          };
        });

        datasets.push({
          label: "Průměr",
          data: avgLines[dayKey],
          borderColor: "#007bff",
          backgroundColor: "#cae2fc",
          borderWidth: 4,
          pointRadius: 8,
          tension: 0.4,
          order: 2,   // bude nahoře
          pointStyle: 'rectRounded',
          isAverage: true,
          fill: 'start'
        });

        new Chart(document.getElementById(dayKey), {
          type: "line",
          data: { datasets },
          options: {
            plugins: {
              legend: {
                  display: true,
                  labels: {
                    filter: function (item, chart) {
                      const ds = chart.datasets[item.datasetIndex];

                      // zobraz jen první šedý a průměr
                      if (ds.isAverage) return true;

                      if (ds.isHistory) {
                        // jen první historický dataset
                        return item.datasetIndex === chart.datasets.findIndex(d => d.isHistory);
                      }

                      return false;
                    }
                  }
              }
              },
              scales: {
                x: {
                  type: "linear",
                  min: 8.5,   // 08:30
                  max: 21.5,  // 21:30
                  ticks: {
                    stepSize: 1,
                    callback: v => {
                      const h = Math.floor(v);
                      const m = Math.round((v - h) * 60);
                      return `${h}:${m.toString().padStart(2, "0")}`;
                    }
                  }
                },
                y: { min: 0, max: 30 }
              }
            }
          });
      }
      ["mon", "tue", "wed", "thu", "fri", "sat", "sun"].forEach(draw);

    }
    loadCSV();
  </script>

</body>

</html>
